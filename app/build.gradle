apply plugin: 'com.android.application'
apply plugin: 'kotlin-parcelize'

// Names the APK "<applicationId>-v<versionName>-<variant>.apk"
base {
    archivesName = "${Blueprint.appId}-v${Blueprint.versionName}"
}

android {
    signingConfigs {
        release {
            keyAlias 'frames'
            keyPassword 'frames'
            storeFile file('frames.jks')
            storePassword 'frames'
            enableV1Signing true
            enableV2Signing true
            enableV3Signing true
            enableV4Signing true
        }
    }

    androidResources {
        // Keep only the languages Blueprint, Kuper and Frames are translated to. AndroidX and
        // Material ship about 100, most of them for strings this app would show in English anyway.
        // Each region is listed because a language code alone does not keep region folders like
        // values-zh-rCN
        localeFilters += [
                "en", "ar", "bn", "ckb", "cs", "da", "de", "el", "es", "fi", "fr", "hi", "hr", "hu",
                "in", "it", "iw", "ja", "ka", "ko", "nb", "nl", "no", "pl", "pt", "ro", "ru", "sr",
                "sv", "ta", "tr", "uk", "vi", "zh",
                "ar-rEG", "ar-rSA", "bn-rBD", "bn-rIN", "ckb-rIR", "cs-rCZ", "da-rDK", "de-rDE",
                "el-rGR", "es-rES", "fi-rFI", "fr-rFR", "hi-rIN", "hr-rHR", "hu-rHU", "in-rID",
                "it-rIT", "iw-rIL", "ja-rJP", "ka-rGE", "ko-rKR", "nl-rNL", "no-rNO", "pl-rPL",
                "pt-rBR", "pt-rPT", "ro-rRO", "ru-rRU", "sr-rSP", "sv-rSE", "ta-rIN", "tr-rTR",
                "uk-rUA", "vi-rVN", "zh-rCN", "zh-rTW"
        ]
    }

    lint {
        abortOnError false
        checkReleaseBuilds true
        disable 'MissingTranslation', 'GoogleAppIndexingWarning'
    }

    namespace Blueprint.appId
    defaultConfig {
        buildConfigField("String", "ONESIGNAL_APP_ID", "\"$OneSignal.appId\"")
        manifestPlaceholders = [
                onesignal_app_id               : OneSignal.appId,
                onesignal_google_project_number: OneSignal.googleProjectNumber
        ]
        applicationId Blueprint.appId
        minSdkVersion Versions.minSdk
        compileSdk Versions.targetSdk
        targetSdkVersion Versions.targetSdk
        versionCode Blueprint.version
        versionName Blueprint.versionName
        vectorDrawables.useSupportLibrary = true
    }

    buildTypes {
        buildTypes.each {
            it.buildConfigField("String", "ONESIGNAL_APP_ID", "\"$OneSignal.appId\"")
        }
        release {
            debuggable false
            zipAlignEnabled true
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

    packagingOptions {
        resources {
            pickFirsts += [
                    'META-INF/core_debug.kotlin_module',
                    'META-INF/core_release.kotlin_module',
                    'META-INF/library_debug.kotlin_module',
                    'META-INF/library_release.kotlin_module'
            ]
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig = true
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation project(':library')
    // TODO: Remove comment marks to enable
    // implementation Libs.oneSignal
}
